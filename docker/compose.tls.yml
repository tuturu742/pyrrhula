# TLS overlay for the self-host compose stack:
#
#   docker compose -f docker/compose.selfhost.yml -f docker/compose.tls.yml up -d
#
# Bring certificates and point PYRRHULA_TLS_CERT_DIR at the directory holding
# fullchain.pem + privkey.pem (certbot's live/<domain>/ works as-is):
#
#   PYRRHULA_TLS_CERT_DIR=/etc/letsencrypt/live/pyrrhula.example.com \
#   PYRRHULA_TLS_SERVER_NAME=pyrrhula.example.com \
#   PYRRHULA_COOKIE_SECURE=true \
#   docker compose -f docker/compose.selfhost.yml -f docker/compose.tls.yml up -d
#
# A lab certificate is one command:
#   openssl req -x509 -newkey rsa:2048 -nodes -days 365 \
#     -keyout privkey.pem -out fullchain.pem -subj "/CN=localhost"
services:
  web:
    volumes:
      - ${PYRRHULA_TLS_CERT_DIR:?set to the directory holding fullchain.pem and privkey.pem}:/etc/nginx/certs:ro
    environment:
      # The web image swaps in its TLS server block (docker/web-tls.sh) and checks the
      # certificates are there before nginx starts.
      PYRRHULA_TLS: provided
      PYRRHULA_API_UPSTREAM: ${PYRRHULA_API_UPSTREAM:-api:8000}
      PYRRHULA_TLS_SERVER_NAME: ${PYRRHULA_TLS_SERVER_NAME:-localhost}
    ports:
      - "${PYRRHULA_HTTP_PORT:-80}:80"
      - "${PYRRHULA_HTTPS_PORT:-443}:443"

  api:
    environment:
      # The other half of terminating TLS: the session cookie stops travelling over
      # plain http (core.config.cookie_secure).
      PYRRHULA_COOKIE_SECURE: "true"
