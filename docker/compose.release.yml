# The release stack: published images, pulled -- no checkout, no build, no toolchain.
#
#   curl -fsSLO https://raw.githubusercontent.com/tuturu742/pyrrhula/main/docker/compose.release.yml
#   curl -fsSLO https://raw.githubusercontent.com/tuturu742/pyrrhula/main/docker/searxng-settings.yml
#   # write a .env (see below), then:
#   docker compose -p pyrrhula -f compose.release.yml up -d
#
# deploy/installers/release.sh does all of that for you, including generating the
# secrets. The one file it needs beside it is searxng-settings.yml, above -- everything
# else is in the images or in .env.
#
# .env must set, with no defaults offered here:
#   PYRRHULA_POSTGRES_PASSWORD   openssl rand -hex 24
#   PYRRHULA_APP_DB_PASSWORD     openssl rand -hex 24
#   PYRRHULA_JWT_SECRET          openssl rand -base64 48
#   PYRRHULA_ENCRYPTION_KEY      openssl rand -base64 32   <- back this up; losing it
#                                                             orphans every stored credential
# and may set PYRRHULA_VERSION to pull a different release than the one below, and
# PYRRHULA_REGISTRY to pull the same images from a mirror (e.g. registry.internal/pyrrhula)
# instead of ghcr.io/tuturu742 -- an air-gapped site, or a build that is not published.
#
# To stand this beside an existing Pyrrhula on the same host -- evaluating a release
# next to a source install, or two deployments on one machine -- set
# PYRRHULA_COMPOSE_PROJECT to something else and give it its own ports:
#
#   PYRRHULA_COMPOSE_PROJECT=pyrrhula-rc
#   PYRRHULA_WEB_PORT=5273
#   PYRRHULA_API_PORT=8100
#
# and pass the same name to compose: `-p pyrrhula-rc`. Container names, the exec-env
# network and the volumes all follow it. Without it nothing changes: the names are the
# ones they always were.

services:
  postgres:
    container_name: ${PYRRHULA_COMPOSE_PROJECT:-pyrrhula}_postgres_1
    image: docker.io/pgvector/pgvector:pg16
    restart: always
    environment:
      POSTGRES_USER: pyrrhula
      POSTGRES_PASSWORD: ${PYRRHULA_POSTGRES_PASSWORD:?set in .env}
      POSTGRES_DB: pyrrhula
    volumes:
      - pyrrhula-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pyrrhula"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    container_name: ${PYRRHULA_COMPOSE_PROJECT:-pyrrhula}_redis_1
    image: docker.io/redis:7
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    image: ${PYRRHULA_REGISTRY:-ghcr.io/tuturu742}/pyrrhula:${PYRRHULA_VERSION:-0.1.0}
    command: ["migrate"]
    environment: &app_env
      PYRRHULA_DATABASE_URL: postgresql+asyncpg://pyrrhula:${PYRRHULA_POSTGRES_PASSWORD}@postgres:5432/pyrrhula
      PYRRHULA_APP_DATABASE_URL: postgresql+asyncpg://pyrrhula_app:${PYRRHULA_APP_DB_PASSWORD}@postgres:5432/pyrrhula
      PYRRHULA_APP_DB_PASSWORD: ${PYRRHULA_APP_DB_PASSWORD:?set in .env}
      PYRRHULA_REDIS_URL: redis://redis:6379/0
      PYRRHULA_JWT_SECRET: ${PYRRHULA_JWT_SECRET:?set in .env (openssl rand -base64 48)}
      PYRRHULA_ADMIN_EMAIL: ${PYRRHULA_ADMIN_EMAIL:-}
      PYRRHULA_ADMIN_PASSWORD: ${PYRRHULA_ADMIN_PASSWORD:-}
      PYRRHULA_ENCRYPTION_KEY: ${PYRRHULA_ENCRYPTION_KEY:?set in .env (openssl rand -base64 32)}
      PYRRHULA_REQUIRE_ENCRYPTION: "1"
      PYRRHULA_SINGLE_TENANT_UI: ${PYRRHULA_SINGLE_TENANT_UI:-true}
      PYRRHULA_BLOB_STORE_ROOT: /app/data/blobs
      PYRRHULA_GIT_HTTP_BASE: ${PYRRHULA_GIT_HTTP_BASE:-http://${PYRRHULA_COMPOSE_PROJECT:-pyrrhula}_api_1:8000}
      PYRRHULA_PUBLIC_BASE_URL: ${PYRRHULA_PUBLIC_BASE_URL:-}
      PYRRHULA_COOKIE_SECURE: ${PYRRHULA_COOKIE_SECURE:-false}
      # Unlike the build-from-source stack, this one defaults to ONLINE. The ~2.2GB
      # retrieval model is too large to bake into an image, so a freshly pulled
      # deployment has an empty cache volume and must fill it once. Starting offline
      # against an empty cache is not a loud failure -- it is a deployment that runs,
      # accepts turns, and retrieves nothing. Set PYRRHULA_HF_OFFLINE=1 after the first
      # successful start if the host should never reach huggingface.co again.
      HF_HUB_OFFLINE: ${PYRRHULA_HF_OFFLINE:-0}
      TRANSFORMERS_OFFLINE: ${PYRRHULA_HF_OFFLINE:-0}
      PYRRHULA_WEB_SEARCH_URL: ${PYRRHULA_WEB_SEARCH_URL:-http://searxng:8080}
    depends_on:
      postgres:
        condition: service_healthy

  api:
    container_name: ${PYRRHULA_COMPOSE_PROJECT:-pyrrhula}_api_1
    image: ${PYRRHULA_REGISTRY:-ghcr.io/tuturu742}/pyrrhula:${PYRRHULA_VERSION:-0.1.0}
    restart: always
    command: ["api"]
    environment: *app_env
    volumes:
      - pyrrhula-blobs:/app/data/blobs
      - pyrrhula-hf:/app/.cache/huggingface
      # Hand-supplied workflow packs, for installs that cannot reach the pinned plugin
      # repositories. A named volume rather than a bind mount: this file may be the only
      # thing on the machine, so there is no ./plugins-local beside it to mount. Drop
      # packs in with `docker cp <file> pyrrhula_api_1:/app/plugins-local/`.
      - pyrrhula-plugins:/app/plugins-local
    ports:
      - "${PYRRHULA_API_PORT:-8000}:8000"
    networks:
      - default
      - envs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  worker:
    container_name: ${PYRRHULA_COMPOSE_PROJECT:-pyrrhula}_worker_1
    image: ${PYRRHULA_REGISTRY:-ghcr.io/tuturu742}/pyrrhula:${PYRRHULA_VERSION:-0.1.0}
    restart: always
    command: ["worker"]
    user: "0"
    environment:
      <<: *app_env
      PYRRHULA_EXEC_SOCKET: /var/run/podman.sock
      PYRRHULA_EXEC_ENGINES: >-
        [{"key":"local","kind":"socket","socket":"/var/run/podman.sock",
          "network":"pyrrhula-envs","label":"Local containers"}]
    volumes:
      - pyrrhula-blobs:/app/data/blobs
      - pyrrhula-hf:/app/.cache/huggingface
      - pyrrhula-plugins:/app/plugins-local
      # Delegated coding agents build and test in isolated sibling containers, which
      # needs the host engine's socket. Rootless podman:
      #   systemctl --user enable --now podman.socket
      # Docker hosts: set PYRRHULA_ENGINE_SOCKET=/var/run/docker.sock in .env.
      - ${PYRRHULA_ENGINE_SOCKET:-/run/user/1000/podman/podman.sock}:/var/run/podman.sock
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  web:
    container_name: ${PYRRHULA_COMPOSE_PROJECT:-pyrrhula}_web
    image: ${PYRRHULA_REGISTRY:-ghcr.io/tuturu742}/pyrrhula-web:${PYRRHULA_VERSION:-0.1.0}
    restart: always
    ports:
      - "${PYRRHULA_WEB_PORT:-5173}:80"
    environment:
      # HTTPS on the same port: PYRRHULA_TLS=self-signed (a certificate is made on first
      # start and kept in pyrrhula-web-certs) or =provided (put fullchain.pem and
      # privkey.pem in that volume). Plain http sent to the port is redirected. Set
      # PYRRHULA_COOKIE_SECURE=true alongside it. Empty = plain http, as before.
      PYRRHULA_TLS: ${PYRRHULA_TLS:-}
      PYRRHULA_TLS_SERVER_NAME: ${PYRRHULA_TLS_SERVER_NAME:-localhost}
      PYRRHULA_TLS_LISTEN: "80"
    volumes:
      - pyrrhula-web-certs:/etc/nginx/certs
    depends_on:
      - api

  # Agent web search, upstream image plus this release's settings -- 82 lines of
  # measured engine selection that no environment variable can express, and that stock
  # SearXNG will not answer /search?format=json without.
  #
  # The settings travel as a file downloaded beside this one rather than baked into an
  # image of our own: republishing 266MB of someone else's project to ship 4KB of
  # configuration would also freeze SearXNG at whatever it was on release day. The
  # inline `configs:` alternative was measured and rejected -- podman-compose accepts it
  # and silently ignores it, leaving stock settings and a search that answers HTTP 200
  # with nothing. A missing file here is loud instead: the container exits 127 saying
  # the settings are not a valid file.
  searxng:
    container_name: ${PYRRHULA_COMPOSE_PROJECT:-pyrrhula}_searxng
    image: docker.io/searxng/searxng:latest
    restart: always
    environment:
      SEARXNG_SECRET: ${PYRRHULA_JWT_SECRET}
      SEARXNG_BASE_URL: http://searxng:8080/
    volumes:
      - ./searxng-settings.yml:/etc/searxng/settings.yml:ro

networks:
  default: {}
  envs:
    name: ${PYRRHULA_COMPOSE_PROJECT:-pyrrhula}-envs

volumes:
  pyrrhula-web-certs:
  pyrrhula-postgres:
  pyrrhula-blobs:
  pyrrhula-hf:
  pyrrhula-plugins:
