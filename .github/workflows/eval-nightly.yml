name: eval-nightly

# E2.8: the pyrrhula-eval harness, on a schedule (plan §8.6/§15.10). Real multi-provider
# arm runs need live provider credentials (OPENAI_API_KEY etc.) this repo doesn't carry
# as committed secrets -- until those are configured, this job runs the harness-skeleton
# suite (scenario loading, matrix/metric computation, the blind-judge payload check)
# against scripted providers, which is exactly what CI can prove without live credentials.
# Wiring real per-provider arm runs is additive here (add steps setting the relevant env
# vars once secrets exist), not a redesign of this job.

on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch: {}

env:
  UV_VERSION: "0.11.29"

jobs:
  eval-harness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          version: ${{ env.UV_VERSION }}
      - run: uv sync --extra dev
      - name: Eval harness skeleton (scenarios, matrix, metrics, blind judge)
        run: uv run pytest packages/eval --no-header -q
