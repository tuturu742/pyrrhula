apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

# Images are the ones dev-up.sh builds and imports straight into k3s's containerd
# (`k3s ctr images import`), under the names the base already uses -- no registry, no
# extra host setup. A fresh machine needs nothing beyond k3s and podman/docker.
#
# IfNotPresent, NOT Always: `localhost/pyrrhula:dev` exists only inside containerd, so
# Always would send the kubelet looking for a registry host literally named "localhost"
# and fail with ImagePullBackOff. The import replaces the tag's content in place, so a
# rebuilt image is picked up on the next pod start without a pull.
#
# For the push-based loop instead (no per-update sudo), use overlays/dev-registry.
patches:
  - target:
      kind: Deployment
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: IfNotPresent
  - target:
      kind: Job
      name: pyrrhula-migrate
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: IfNotPresent

# secrets.env is git-ignored; create it next to this file:
#   POSTGRES_PASSWORD=$(openssl rand -hex 24)
#   APP_DB_PASSWORD=$(openssl rand -hex 24)
#   JWT_SECRET=$(openssl rand -base64 48)
#   ENCRYPTION_KEY=$(openssl rand -base64 32)
#   DATABASE_URL=postgresql+asyncpg://pyrrhula:<POSTGRES_PASSWORD>@postgres:5432/pyrrhula
#   APP_DATABASE_URL=postgresql+asyncpg://pyrrhula_app:<APP_DB_PASSWORD>@postgres:5432/pyrrhula
# (dev-up.sh generates it for you on first run.)
secretGenerator:
  - name: pyrrhula-secrets
    namespace: pyrrhula
    envs:
      - secrets.env

generatorOptions:
  disableNameSuffixHash: true
