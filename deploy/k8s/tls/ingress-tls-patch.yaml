# Patch the app ingress onto TLS. Copy into an overlay and set BOTH the host and the
# issuer for your deployment; cert-manager watches the annotation, solves HTTP-01, and
# writes the certificate into `pyrrhula-web-tls`.
#
# Remember the other half: set PYRRHULA_COOKIE_SECURE=true once TLS terminates here, so
# the session cookie stops travelling over plain http.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  namespace: pyrrhula
  name: pyrrhula-web
  annotations:
    cert-manager.io/cluster-issuer: pyrrhula-letsencrypt-prod
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    # Redirect plain http to https at the router (k3s/traefik middleware below).
    traefik.ingress.kubernetes.io/router.middlewares: pyrrhula-redirect-https@kubernetescrd
spec:
  tls:
    - hosts:
        - pyrrhula.example.com
      secretName: pyrrhula-web-tls
  rules:
    - host: pyrrhula.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: pyrrhula-web
                port:
                  number: 80
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  namespace: pyrrhula
  name: redirect-https
spec:
  redirectScheme:
    scheme: https
    permanent: true
