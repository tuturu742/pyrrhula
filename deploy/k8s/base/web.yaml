apiVersion: v1
kind: Service
metadata:
  namespace: pyrrhula
  name: pyrrhula-web
spec:
  selector:
    app: pyrrhula-web
  ports:
    - port: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: pyrrhula
  name: pyrrhula-web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pyrrhula-web
  template:
    metadata:
      labels:
        app: pyrrhula-web
    spec:
      # Service env-var injection (PYRRHULA_ADMIN_PORT=tcp://...) collides with
      # pydantic-settings' PYRRHULA_ prefix -- observed live as a worker crashloop.
      enableServiceLinks: false
      containers:
        - name: web
          image: localhost/pyrrhula-web:dev
          imagePullPolicy: IfNotPresent
          env:
            - name: PYRRHULA_API_UPSTREAM
              value: pyrrhula-api.pyrrhula.svc.cluster.local:8000
          ports:
            - containerPort: 80
---
# k3s ships traefik; *.localhost resolves to 127.0.0.1 in browsers, so the app is
# reachable at http://pyrrhula.localhost with zero DNS setup.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  namespace: pyrrhula
  name: pyrrhula-web
spec:
  rules:
    - host: pyrrhula.localhost
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: pyrrhula-web
                port:
                  number: 80
