# Host-side ollama (GPU) reachable from pods as http://ollama:11434. A Service with
# manual EndpointSlice pointing at the node/host IP -- the overlay patches the address
# (see overlays/dev). Remove both if the deployment is cloud-keys-only.
apiVersion: v1
kind: Service
metadata:
  namespace: pyrrhula
  name: ollama
spec:
  ports:
    - port: 11434
      targetPort: 11434
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  namespace: pyrrhula
  name: ollama-1
  labels:
    kubernetes.io/service-name: ollama
addressType: IPv4
ports:
  - port: 11434
endpoints:
  - addresses:
      - 192.168.8.241 # patched per-machine in the overlay
